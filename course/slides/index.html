<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neovim desde cero</title>
  <meta name="description" content="Curso de Neovim en español: desde los modos hasta la configuración como IDE con IA.">
  <link rel="stylesheet" href="slides.css">
</head>
<body>
  <div id="ui">
    <div id="progress"><div id="progress-bar"></div></div>

    <div id="stage-wrapper">
      <div id="stage"></div>
    </div>

    <div id="footer">
      <span id="module-label"></span>
      <span id="slide-counter"></span>
    </div>

    <div id="notes-panel" style="display:none"></div>
    <div id="overview"    style="display:none"></div>
    <div id="help-panel"  style="display:none"></div>

    <div id="number-input" style="display:none">
      <span class="ni-num"></span>
      <span class="ni-hint">+ Enter = saltar al módulo</span>
    </div>

    <div id="loader" style="display:none">
      <div class="loader-title">Cargando curso...</div>
    </div>
  </div>
  <script src="deck.js"></script>
  <script src="slides.js"></script>
</body>
</html>
