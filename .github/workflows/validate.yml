name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5
      - run: python scripts/verify.py --install
  trainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5
      - run: python scripts/vim_reference.py --check
      - run: flutter pub get
        working-directory: trainer
      - run: flutter analyze
        working-directory: trainer
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: trainer
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: flutter test --coverage
        working-directory: trainer
      - run: python scripts/check_coverage.py --min 90
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements-docs.txt
      - run: python scripts/check_docs.py
