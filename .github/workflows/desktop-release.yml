name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: trainer-windows-x64
          - os: ubuntu-latest
            artifact: trainer-linux-x64
          - os: macos-latest
            artifact: trainer-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Linux GTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter test
      - run: flutter config --enable-windows-desktop
        if: runner.os == 'Windows'
      - run: flutter config --enable-linux-desktop
        if: runner.os == 'Linux'
      - run: flutter config --enable-macos-desktop
        if: runner.os == 'macOS'
      - run: flutter build windows --release
        if: runner.os == 'Windows'
      - run: flutter build linux --release
        if: runner.os == 'Linux'
      - run: flutter build macos --release
        if: runner.os == 'macOS'
      - name: Pack Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ${{ matrix.artifact }}.zip
      - name: Pack Linux
        if: runner.os == 'Linux'
        run: tar -C build/linux/x64/release/bundle -czf ${{ matrix.artifact }}.tar.gz .
      - name: Pack macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/*.app ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: trainer/${{ matrix.artifact }}.*
